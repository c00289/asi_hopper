# Continuous integration: every push to main, every v* tag and every pull request runs ruff and pytest on
# windows-latest, the platform Hopper runs on (keyring goes to Windows Credential Manager). A release is green
# by this, not by anyone's word.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: asi_hopper
    steps:
      - uses: actions/checkout@v4
        with:
          path: asi_hopper
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q
